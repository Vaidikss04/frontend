<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — CampusEvents Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <div class="dash-wrap">
    <div class="sidebar">
      <div class="brand">🎟️ CampusEvents<br><small style="font-weight:400; opacity:0.7; font-size:12px;">Admin Panel</small></div>
      <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="manage-events.html">Manage Events</a>
        <a href="add-event.html">Add Event</a>
        <a href="users.html" class="active">Users</a>
      </nav>
      <a class="logout-link" onclick="logout()">Logout</a>
    </div>

    <div class="dash-main">
      <h1>Registered Users</h1>
      <p style="color:var(--text-muted);">Everyone who has signed up on the platform.</p>

      <table class="data-table">
        <thead>
          <tr><th>Name</th><th>Email</th><th>Events Registered</th></tr>
        </thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    const session = requireRole('admin');
    if (session) loadUsersList();
  </script>
</body>
</html>
