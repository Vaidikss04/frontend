<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — CampusEvents</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-side">
      <div class="brand">🎟️ CampusEvents</div>
      <h1>Welcome back. Your next event is one click away.</h1>
      <p>Log in to browse events, register instantly, and keep track of everything you've signed up for.</p>
    </div>

    <div class="auth-form-side">
      <div class="auth-box">
        <h2>Log In</h2>
        <p class="sub">Enter your details to continue</p>

        <form id="login-form" onsubmit="loginUser(event)">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@campus.edu">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <div class="error-msg" id="error-msg"></div>
          <button type="submit" class="btn btn-primary btn-full">Log In</button>
        </form>

        <div class="demo-hint">
          <strong>Admin demo login:</strong> admin@campus.edu / admin123
        </div>

        <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
