<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — CampusEvents</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <nav class="navbar">
    <div class="brand">🎟️ CampusEvents</div>
    <div class="nav-links">
      <a href="user-dashboard.html" class="active">Dashboard</a>
      <a href="events.html">Browse Events</a>
      <a href="my-events.html">My Registrations</a>
      <a onclick="logout()" style="cursor:pointer;">Logout</a>
    </div>
  </nav>

  <div class="page">
    <h1>Welcome, <span id="welcome-name">Student</span> 👋</h1>
    <p style="color:var(--text-muted);">Here's what's happening on campus.</p>

    <div class="stat-grid" style="grid-template-columns: repeat(2, 1fr); max-width: 500px;">
      <div class="stat-card amber">
        <div class="num" id="stat-total-events">0</div>
        <div class="label">Events Available</div>
      </div>
      <div class="stat-card teal">
        <div class="num" id="stat-my-regs">0</div>
        <div class="label">Your Registrations</div>
      </div>
    </div>

    <div class="section-head">
      <h2>Upcoming Events</h2>
      <a href="events.html" class="btn btn-outline-dark btn-small">View All →</a>
    </div>
    <div class="event-grid" id="preview-grid"></div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/user.js"></script>
  <script>
    const session = requireRole('user');
    if (session) loadUserDashboard(session);
  </script>
</body>
</html>
