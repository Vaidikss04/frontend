<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Event — CampusEvents Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <div class="dash-wrap">
    <div class="sidebar">
      <div class="brand">🎟️ CampusEvents<br><small style="font-weight:400; opacity:0.7; font-size:12px;">Admin Panel</small></div>
      <nav>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="manage-events.html">Manage Events</a>
        <a href="add-event.html" class="active">Add Event</a>
        <a href="users.html">Users</a>
      </nav>
      <a class="logout-link" onclick="logout()">Logout</a>
    </div>

    <div class="dash-main" style="max-width: 560px;">
      <h1>Add a New Event</h1>
      <p style="color:var(--text-muted);">Fill in the details below to publish a new event.</p>

      <div class="card" style="padding: 30px; margin-top: 20px;">
        <form onsubmit="addEvent(event)">
          <div class="form-group"><label for="title">Event Title</label><input type="text" id="title" required placeholder="e.g. Tech Fest 2027"></div>
          <div class="form-group"><label for="date">Date</label><input type="date" id="date" required></div>
          <div class="form-group"><label for="location">Location</label><input type="text" id="location" required placeholder="e.g. Main Auditorium"></div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category">
              <option value="Technical">Technical</option>
              <option value="Cultural">Cultural</option>
              <option value="Sports">Sports</option>
              <option value="Workshop">Workshop</option>
            </select>
          </div>
          <div class="form-group"><label for="capacity">Capacity</label><input type="number" id="capacity" min="1" required placeholder="e.g. 150"></div>
          <div class="form-group"><label for="description">Description</label><textarea id="description" rows="4" required placeholder="What is this event about?"></textarea></div>
          <button type="submit" class="btn btn-primary btn-full">Publish Event</button>
        </form>
      </div>
    </div>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/events.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    const session = requireRole('admin');
  </script>
</body>
</html>
