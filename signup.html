<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — CampusEvents</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-side">
      <div class="brand">🎟️ CampusEvents</div>
      <h1>Create your account and never miss a campus event again.</h1>
      <p>Sign up once, then register for tech fests, hackathons, cultural nights and workshops in seconds.</p>
    </div>

    <div class="auth-form-side">
      <div class="auth-box">
        <h2>Sign Up</h2>
        <p class="sub">It only takes a minute</p>

        <form id="signup-form" onsubmit="signupUser(event)">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="you@campus.edu">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required minlength="4" placeholder="At least 4 characters">
          </div>
          <div class="error-msg" id="error-msg"></div>
          <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
