<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Event Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Campus<span>Events</span></div>
      <nav>
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="events.html">Browse events</a>
        <a href="my-events.html">My registrations</a>
      </nav>
      <button class="logout-btn" onclick="logoutUser()">Log out</button>
    </aside>

    <main class="main">
      <div class="main-head">
        <div>
          <h1>Welcome back, <span id="userName"></span></h1>
          <p>Here's a quick look at what's happening on campus.</p>
        </div>
        <a href="events.html" class="btn btn-primary">Browse events</a>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><strong id="statEvents">0</strong><span>Events open now</span></div>
        <div class="stat-card"><strong id="statMyRegs">0</strong><span>Your registrations</span></div>
        <div class="stat-card"><strong id="statUpcoming">0</strong><span>Upcoming this month</span></div>
      </div>

      <h2 style="font-size:1.1rem; margin-bottom:16px;">Recently added events</h2>
      <div class="event-container" id="recentEvents"></div>
    </main>
  </div>

  <script src="../js/auth.js"></script>
  <script src="../js/events.js"></script>
  <script>
    const user = requireRole('user');

    function handleRegister(eventId) {
      const result = registerForEvent(eventId, user.email);
      if (!result.success) { alert(result.message); return; }
      render();
    }

    function render() {
      if (!user) return;
      document.getElementById('userName').textContent = user.name;

      const events = getEvents();
      const myRegs = getUserRegistrations(user.email);
      const now = new Date();
      const upcoming = events.filter(e => {
        const d = new Date(e.date);
        return d >= now && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
      });

      document.getElementById('statEvents').textContent = events.length;
      document.getElementById('statMyRegs').textContent = myRegs.length;
      document.getElementById('statUpcoming').textContent = upcoming.length;

      const registeredIds = myRegs.map(e => e.id);
      const recent = [...events].slice(-3).reverse();
      const container = document.getElementById('recentEvents');
      container.innerHTML = recent.length
        ? recent.map(ev => renderEventCard(ev, registeredIds.includes(ev.id))).join('')
        : '<p class="empty-state">No events yet — check back soon.</p>';
    }

    render();
  </script>
</body>
</html>
